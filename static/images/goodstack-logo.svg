<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Goodstack logo</title>
  <desc id="desc">Dark purple background with a stylized purple icon and white Goodstack wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#301353"/>
      <stop offset="100%" stop-color="#26103f"/>
    </linearGradient>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a52ff"/>
      <stop offset="100%" stop-color="#7b3df2"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>

  <g transform="translate(170 370)">
    <path d="M0 0
             C0 -45 36 -82 82 -82
             C128 -82 164 -45 164 0
             C164 45 128 82 82 82
             C36 82 0 45 0 0Z"
          fill="none" stroke="url(#mark)" stroke-width="28"/>
    <path d="M24 0C24 -28 47 -51 75 -51H90C118 -51 141 -28 141 0C141 28 118 51 90 51H75C47 51 24 28 24 0Z" fill="#301353"/>
    <rect x="0" y="120" width="190" height="34" rx="4" fill="#8a43f0"/>
    <rect x="0" y="176" width="190" height="34" rx="4" fill="#8a43f0"/>
  </g>

  <g transform="translate(420 472)" fill="#ffffff">
    <text x="0" y="0" font-family="Poppins, Avenir Next, Helvetica Neue, Arial, sans-serif" font-size="132" font-weight="800" letter-spacing="-2">
      goodstack
    </text>
  </g>
</svg>
